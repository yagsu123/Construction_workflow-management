<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects — PWD Infrastructure Workflow</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main>
  <h1>Projects</h1>
  <p class="lede">Detailed Project Reports moving through JE &rarr; AE &rarr; DEE &rarr; Executive Engineer.</p>

  <div class="card" style="padding:0;overflow-x:auto">
    <table>
      <thead>
        <tr><th>Code</th><th>Project</th><th>Budget</th><th>Stage</th><th>Waiting on</th><th>In stage</th></tr>
      </thead>
      <tbody id="rows"><tr><td colspan="6" class="empty">Loading&hellip;</td></tr></tbody>
    </table>
  </div>

  <h2 id="dprHead" hidden>New DPR submission</h2>
  <div class="card" id="dprCard" hidden>
    <form id="dpr">
      <div class="rowsplit">
        <div class="field">
          <label for="title">Project title</label>
          <input id="title" name="title" required placeholder="Widening of SH-41, km 12 to km 19">
        </div>
        <div class="field">
          <label for="budget">Sanctioned budget (₹)</label>
          <input id="budget" name="budget" type="number" min="1" step="1" required placeholder="24500000">
        </div>
      </div>
      <div class="rowsplit">
        <div class="field">
          <label for="department">Department</label>
          <select id="department" name="department" required></select>
        </div>
        <div class="field">
          <label for="contractor">Contractor (optional)</label>
          <input id="contractor" name="contractor" placeholder="M/s Patel Infra Pvt Ltd">
        </div>
      </div>
      <div class="rowsplit">
        <div class="field">
          <label for="site">Site location (geofence centre)</label>
          <div class="actions">
            <button type="button" id="siteFix">Use my location</button>
            <span class="muted mono" id="siteOut">optional — no geofence if left blank</span>
          </div>
        </div>
        <div class="field">
          <label for="radius">Geofence radius (m)</label>
          <input id="radius" type="number" min="25" step="25" placeholder="250">
        </div>
      </div>
      <div class="actions">
        <button class="primary" type="submit">Create DPR</button>
        <span class="muted">Created as a draft with the JE. Submitting it for test-check is a separate, ledgered action.</span>
      </div>
    </form>
  </div>
</main>

<script type="module">
import { mountHeader, requireUser, getRole, api, esc, money, toast } from '/common.js';
import { getPosition, coords } from '/emb.js';

let site = null;

await requireUser();
mountHeader('/');
const rows = document.getElementById('rows');

function render(projects) {
  if (!projects.length) {
    rows.innerHTML = `<tr><td colspan="6" class="empty">No projects yet. Run <code>npm run seed</code> for the demo dataset, or create a DPR below.</td></tr>`;
    return;
  }
  rows.innerHTML = projects.map(p => `
    <tr class="clickable" data-id="${p.id}">
      <td class="mono">${esc(p.code)}</td>
      <td><a class="plain" href="/project.html?id=${p.id}">${esc(p.title)}</a>
          <div class="muted" style="font-size:12px">${esc(p.department)}</div></td>
      <td>${money(p.budget)}</td>
      <td><span class="pill ${p.current_stage === 'PAYMENT_TRIGGERED' ? 'ok' : ''}">${esc(p.stage_label)}</span></td>
      <td>${p.waiting_on ? `<span class="pill muted">${esc(p.waiting_on)}</span>` : '<span class="muted">—</span>'}</td>
      <td>${p.overdue ? `<span class="pill danger">${p.days_in_stage} d · past SLA</span>` : `${p.days_in_stage} d`}</td>
    </tr>`).join('');

  rows.querySelectorAll('tr.clickable').forEach(tr => {
    tr.addEventListener('click', e => {
      if (e.target.closest('a')) return;
      location.href = `/project.html?id=${tr.dataset.id}`;
    });
  });
}

async function load() {
  try { render((await api('/api/projects')).projects); }
  catch (err) { rows.innerHTML = `<tr><td colspan="6" class="empty">${esc(err.message)}</td></tr>`; }
}

api('/api/meta').then(({ departments }) => {
  document.getElementById('department').innerHTML = departments.map(d => `<option>${esc(d)}</option>`).join('');
});

document.getElementById('dpr').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  try {
    const { project } = await api('/api/projects', {
      method: 'POST',
      body: {
        title: f.title.value, budget: f.budget.value,
        department: f.department.value, contractor: f.contractor.value,
        site_lat: site?.lat ?? null, site_lng: site?.lng ?? null,
        site_radius_m: document.getElementById('radius').value || null,
      },
    });
    toast(`${project.code} created`);
    f.reset();
    load();
  } catch (err) { toast(err.message, 'danger'); }
});

document.getElementById('siteFix')?.addEventListener('click', async e => {
  e.target.disabled = true;
  const out = document.getElementById('siteOut');
  out.textContent = 'locating…';
  try {
    site = await getPosition();
    out.textContent = `${coords(site.lat, site.lng)} ±${Math.round(site.accuracy)} m`;
  } catch (err) {
    site = null;
    out.textContent = err.message;
  } finally { e.target.disabled = false; }
});

if (getRole() === 'JE') {
  document.getElementById('dprHead').hidden = false;
  document.getElementById('dprCard').hidden = false;
}

load();
</script>
</body>
</html>
