<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PWD Infrastructure Workflow</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">PWD Infrastructure Workflow
    <small>Digital MB approval &middot; tamper-evident ledger</small>
  </div>
  <div class="spacer"></div>
  <div class="rolebox" id="rolebox" style="display:none">
    <label for="role-select">Acting as:</label>
    <select id="role-select"></select>
  </div>
  <nav class="topnav">
    <a href="#" id="nav-projects" aria-current="page">Projects</a>
    <a href="#" id="nav-ledger">Ledger</a>
  </nav>
</header>

<main id="app-root">
  <!-- Content dynamically loaded here -->
</main>

<div id="toast" class="toast"></div>

<!-- Templates -->
<template id="tpl-projects">
  <div class="rowsplit" style="align-items: center; margin-bottom: 24px;">
    <h1 style="margin:0">Active Projects</h1>
    <div style="text-align: right;" id="btn-new-project-container">
      <button class="primary" id="btn-new-project">New DPR</button>
    </div>
  </div>
  <div class="card" style="padding:0; overflow-x:auto;">
    <table id="projects-table">
      <thead>
        <tr>
          <th>Code</th>
          <th>Title</th>
          <th>Stage</th>
          <th>Waiting on</th>
          <th>Time in stage</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</template>

<template id="tpl-project-detail">
  <div style="margin-bottom: 16px;">
    <a href="#" id="pd-back" class="plain muted">&larr; Back to projects</a>
  </div>
  <div class="rowsplit" style="align-items: baseline; margin-bottom: 24px;">
    <h1 style="margin:0" id="pd-title"></h1>
    <div class="mono muted" id="pd-code"></div>
  </div>
  <div class="card">
    <div class="stepper" id="pd-stepper"></div>
  </div>
  <div class="rowsplit">
    <div class="card" style="flex:2">
      <h2 style="margin-top:0">Project Details</h2>
      <table>
        <tbody>
          <tr><th>Department</th><td id="pd-dept"></td></tr>
          <tr><th>Budget</th><td id="pd-budget"></td></tr>
          <tr><th>Contractor</th><td id="pd-contractor"></td></tr>
        </tbody>
      </table>
      
      <div id="pd-actions-container" style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); display: none;">
        <h2 style="margin-top:0">Available Actions (<span id="pd-acting-as"></span>)</h2>
        <div class="actions" id="pd-actions"></div>
        <div id="pd-action-form" style="display:none; margin-top: 12px;">
          <div class="field">
            <label for="pd-comment">Reason / Note <span class="muted">(required for rejection)</span></label>
            <input type="text" id="pd-comment" placeholder="...">
          </div>
          <button class="primary" id="pd-action-confirm">Confirm</button>
          <button class="btn" id="pd-action-cancel">Cancel</button>
        </div>
      </div>
    </div>
    <div class="card" style="flex:3">
      <h2 style="margin-top:0">Audit Trail</h2>
      <ul class="timeline" id="pd-timeline"></ul>
    </div>
  </div>
</template>

<template id="tpl-new-dpr">
  <div style="margin-bottom: 16px;">
    <a href="#" id="new-dpr-back" class="plain muted">&larr; Back to projects</a>
  </div>
  <h1 style="margin-bottom: 24px">Submit New DPR</h1>
  <div class="card" style="max-width: 500px">
    <form id="form-new-dpr">
      <div class="field">
        <label for="dpr-title">Project Title</label>
        <input type="text" id="dpr-title" required>
      </div>
      <div class="field">
        <label for="dpr-dept">Department</label>
        <select id="dpr-dept" required></select>
      </div>
      <div class="field">
        <label for="dpr-budget">Budget (Rs)</label>
        <input type="number" id="dpr-budget" min="1" step="any" required>
      </div>
      <div class="field">
        <label for="dpr-contractor">Contractor (Optional)</label>
        <input type="text" id="dpr-contractor">
      </div>
      <div class="actions" style="margin-top: 24px">
        <button type="submit" class="primary">Submit DPR</button>
      </div>
    </form>
  </div>
</template>

<script src="/app.js"></script>
</body>
</html>
